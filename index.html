<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Shadow Rush</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <div id="hud">
      <div>❤️ <span id="health">100</span></div>
      <div>🪙 <span id="coins">0</span></div>
      <div>🏆 <span id="score">0</span></div>
    </div>

    <div id="player">
      <div id="weapon">⚔️</div>
    </div>

    <!-- Mobile movement -->
    <div id="controls">

      <button id="up">▲</button>

      <div class="middle-controls">
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
      </div>

    </div>

    <!-- Attack -->
    <button id="attackButton">⚔️</button>

  </div>

  <script src="game.js"></script>

</body>
</html>
